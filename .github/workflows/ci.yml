name: CI
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci --runInBand
        
      - name: Build image
        run: docker build -t app:ci .

      - name: Test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name app-ci -p 3000:3000 app:ci
          cleanup() {
            docker inspect --format '{{json .State}}' app-ci || true
            docker logs app-ci || true
            docker rm -f app-ci || true
          }
          trap cleanup EXIT
          curl --fail --show-error --retry 12 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 2 --max-time 5  http://localhost:3000/health

      - name: Report image size
        run: |
          IMAGE_BYTES=$(docker image inspect app:ci --format '{{.Size}}')
          echo "Image size: ${IMAGE_BYTES} bytes" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: app:ci
          scanners: vuln
          format: json
          output: ${{ github.workspace }}/trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          timeout: 10m

      - name: Generate Trivy summary and PR comment
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        with:
          script: |
            const path = require('path');
            const generateReport = require(
              path.join(
                process.env.GITHUB_WORKSPACE,
                '.github/scripts/trivy-report.cjs'
              )
            );

            await generateReport({ github, context, core });

      - name: Upload Trivy report
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            ${{ github.workspace }}/trivy-results.json
            ${{ github.workspace }}/trivy-summary.md
          retention-days: 14
          if-no-files-found: warn
  
  publish:
    name: Publish img to ECR
    needs: test
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    concurrency:
      group: ecr-publish-main
      cancel-in-progress: false
    
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      IMAGE_TAG: ${{ github.sha }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);

            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );

            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub
            }, null, 2));
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Verify aws identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          ECR_REPOSITORY="${ECR_REPOSITORY_URL#*/}"

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" > /dev/null 2> ecr-check-error.txt; 
          then
            echo "Image already exists; skipping build and push."

          elif grep -q "ImageNotFoundException" ecr-check-error.txt; 
          then
            docker build -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" ./src
            echo "Pushing image to ECR..."
            docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"

          else
            cat ecr-check-error.txt >&2
            exit 1
          fi

      - name: Record published image
        shell: bash
        run: |
          set -euo pipefail

          ECR_REPOSITORY="${ECR_REPOSITORY_URL#*/}"

          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          {
            echo "### Published image"
            echo "- Tag: $IMAGE_TAG"
            echo "- URI: $ECR_REPOSITORY_URL@$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ECS
    needs: publish
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: ecs-deploy-master
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      IMAGE_TAG: ${{ github.sha }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve published image
        shell: bash
        run: |
          set -euo pipefail

          ECR_REPOSITORY="${ECR_REPOSITORY_URL#*/}"

          IMAGE_DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; 
          then
            echo "Invalid or missing image digest." >&2
            exit 1
          fi

          echo "TF_VAR_image_uri=$ECR_REPOSITORY_URL@$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform -chdir=infra/app init -input=false -lockfile=readonly -backend-config=backend.hcl

      - name: Check Terraform configuration
        run: |
          terraform -chdir=infra/app fmt -check
          terraform -chdir=infra/app validate

      - name: Reject outdated workflow run
        shell: bash
        run: |
          set -euo pipefail

          LATEST_SHA=$(git ls-remote origin refs/heads/master | cut -f1)

          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; 
          then
            echo "A newer commit exists on master; deploy its workflow instead."
            exit 1
          fi

      - name: Terraform plan
        run: |
          terraform -chdir=infra/app plan -input=false -lock-timeout=5m -out=deploy.tfplan

      - name: Terraform apply
        run: |
          terraform -chdir=infra/app apply -input=false -lock-timeout=5m deploy.tfplan

      - name: Verify ECS deployment
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER=$(terraform -chdir=infra/app output -raw cluster_name)
          SERVICE=$(terraform -chdir=infra/app output -raw service_name)
          EXPECTED_TASK=$(terraform -chdir=infra/app output -raw task_definition_arn)

          echo "Cluster: $CLUSTER"
          echo "Service: $SERVICE"
          echo "Expected task definition: $EXPECTED_TASK"
          echo "Expected image: $TF_VAR_image_uri"

          show_details() {
            jq '{
              failures,
              services: [.services[] | {
                status,
                taskDefinition,
                desiredCount,
                runningCount,
                pendingCount,
                deployments,
                events: .events[:10]
              }]
            }' service.json
          }

          verified=false
          deadline=$((SECONDS + 600))

          while (( SECONDS < deadline )); do
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --output json > service.json

            if ! jq -e '
              (.failures | length) == 0
              and (.services | length) == 1
            ' service.json > /dev/null; then
              echo "::error::ECS service lookup failed."
              show_details
              exit 1
            fi

            jq --arg expected "$EXPECTED_TASK" '
              .services[0] | {
                actualTaskDefinition: .taskDefinition,
                expectedTaskDefinition: $expected,
                desired: .desiredCount,
                running: .runningCount,
                pending: .pendingCount,
                checks: {
                  serviceActive: (.status == "ACTIVE"),
                  expectedTask: (.taskDefinition == $expected),
                  hasDesiredTasks: (.desiredCount > 0),
                  runningMatchesDesired: (.runningCount == .desiredCount),
                  noPendingTasks: (.pendingCount == 0),
                  singleDeployment: ((.deployments | length) == 1),
                  expectedDeployment:
                    (.deployments[0].taskDefinition == $expected),
                  rolloutCompleted:
                    (.deployments[0].rolloutState == "COMPLETED")
                }
              }
            ' service.json > verification.json

            cat verification.json

            if jq -e --arg expected "$EXPECTED_TASK" '
              any(.services[0].deployments[];
                .taskDefinition == $expected
                and .rolloutState == "FAILED"
              )
            ' service.json > /dev/null; then
              echo "::error::The expected ECS deployment failed."
              show_details
              exit 1
            fi

            if jq -e '
              .checks | all(.[]; . == true)
            ' verification.json > /dev/null; then
              verified=true
              break
            fi

            echo "Waiting 15 seconds for the expected deployment..."
            sleep 15
          done

          if [ "$verified" != "true" ]; then
            echo "::error::The expected ECS deployment did not stabilize within 10 minutes."
            show_details
            exit 1
          fi

          ACTUAL_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$EXPECTED_TASK" \
            --query "taskDefinition.containerDefinitions[?name=='app'].image | [0]" \
            --output text)

          if [ "$ACTUAL_IMAGE" != "$TF_VAR_image_uri" ]; then
            echo "::error::Task definition image does not match the published image."
            echo "Expected: $TF_VAR_image_uri"
            echo "Actual:   $ACTUAL_IMAGE"
            exit 1
          fi

          echo "ECS deployment verified successfully."

      - name: Smoke test application
        shell: bash
        run: |
          set -euo pipefail

          APP_URL=$(terraform -chdir=infra/app output -raw application_url)

          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 60 \
            --connect-timeout 5 \
            --max-time 10 \
            "$APP_URL/health" \
            -o health.json

          jq -e '.status == "ok"' health.json

          {
            echo "### Deployment successful"
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $TF_VAR_image_uri"
            echo "- Application: $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload ECS verification diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ecs-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            service.json
            verification.json
          if-no-files-found: ignore
          retention-days: 7