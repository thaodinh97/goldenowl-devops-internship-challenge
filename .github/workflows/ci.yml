name: CI
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci --runInBand
        
      - name: Build image
        run: docker build -t app:ci .

      - name: Test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name app-ci -p 3000:3000 app:ci
          trap 'docker logs app-ci; docker rm -f app-ci' EXIT
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 --retry-max-time 60 http://localhost:3000/health

      - name: Report image size
        run: |
          IMAGE_BYTES=$(docker image inspect app:ci --format '{{.Size}}')
          echo "Image size: ${IMAGE_BYTES} bytes" >> "$GITHUB_STEP_SUMMARY"